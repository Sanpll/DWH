name: cinema-dwh

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: cinema-dwh-airflow:2.10.5-spark3.5.4
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-only-change-before-sharing
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow:/opt/airflow/jobs
    PYSPARK_PYTHON: /usr/local/bin/python
    SPARK_MASTER: local[4]
    S3_ENDPOINT: http://rustfs:9000
    S3_BUCKET: cinema
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: cinema
    CLICKHOUSE_PASSWORD: cinema-local-secret
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_DEFAULT_REGION: us-east-1
    AWS_EC2_METADATA_DISABLED: "true"
    TZ: UTC
  volumes:
    - ./dags:/opt/airflow/dags
    - ./jobs:/opt/airflow/jobs
    - ./scripts:/opt/airflow/scripts:ro
    - ./data:/opt/airflow/data:ro
    - ./sql:/opt/airflow/sql:ro
    - ./spark-defaults.conf:/home/airflow/.local/lib/python3.11/site-packages/pyspark/conf/spark-defaults.conf:ro
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.events --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.profile_changes --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.fixture.events --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.fixture.profile_changes --partitions 3 --replication-factor 1;
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.4
    user: "10001:10001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.27.41
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3 mb s3://cinema
        || aws --endpoint-url http://rustfs:9000 s3 ls s3://cinema
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema-local-secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: Student
      _AIRFLOW_WWW_USER_LASTNAME: Local
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: student@example.com
    command: version
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT}:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  jupyter:
    <<: *airflow-common
    profiles: [notebook]
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:8888"
    environment:
      <<: *airflow-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./jobs:/opt/airflow/jobs:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./data:/opt/airflow/data:ro
      - ./sql:/opt/airflow/sql:ro
      - ./notebooks:/opt/airflow/notebooks
      - ./spark-defaults.conf:/home/airflow/.local/lib/python3.11/site-packages/pyspark/conf/spark-defaults.conf:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command:
      - bash
      - -ec
      - >-
        exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
        --ServerApp.token="$${JUPYTER_TOKEN}"
        --ServerApp.root_dir=/opt/airflow/notebooks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8888/api?token=$${JUPYTER_TOKEN}\" >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  archiver-events:
    <<: *airflow-common
    profiles: [archive]
    environment:
      <<: *airflow-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: [python, /opt/airflow/scripts/archive_kafka_to_s3.py, --topic, cinema.events, --group, s3_archive_events_v1]

  archiver-profiles:
    <<: *airflow-common
    profiles: [archive]
    environment:
      <<: *airflow-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: [python, /opt/airflow/scripts/archive_kafka_to_s3.py, --topic, cinema.profile_changes, --group, s3_archive_profiles_v1]

  archiver-fixture-events:
    <<: *airflow-common
    profiles: [late-test]
    environment:
      <<: *airflow-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: [python, /opt/airflow/scripts/archive_kafka_to_s3.py, --topic, cinema.fixture.events, --group, s3_archive_fixture_events_v1, --prefix, late_test]

  archiver-fixture-profiles:
    <<: *airflow-common
    profiles: [late-test]
    environment:
      <<: *airflow-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: [python, /opt/airflow/scripts/archive_kafka_to_s3.py, --topic, cinema.fixture.profile_changes, --group, s3_archive_fixture_profiles_v1, --prefix, late_test]


volumes:
  kafka-data:
  rustfs-data:
  rustfs-logs:
  clickhouse-data:
  postgres-data:
  airflow-logs:
